<VirtualHost *:80>
    ServerName esports.dev
    Redirect permanent / https://esports.dev/
</VirtualHost>

<VirtualHost *:443>
    ServerName esports.dev
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/esports.dev.pem
    SSLCertificateKeyFile /etc/apache2/ssl/esports.dev-key.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/esports_error.log
    CustomLog ${APACHE_LOG_DIR}/esports_access.log combined
</VirtualHost>
